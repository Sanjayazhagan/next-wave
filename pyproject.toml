[project]
name = "next-wave"
version = "0.1.0"
description = "GradientZero agent API, starting with the WhatsApp channel"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11",
    "pillow-heif>=0.20",
    "pycryptodome>=4.2.0",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: needs real API keys, tesseract or fixtures; skipped otherwise"]
