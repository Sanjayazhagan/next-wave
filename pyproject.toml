[project]
name = "next-wave"
version = "0.1.0"
description = "GradientZero agent API, starting with the WhatsApp channel"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.115",
    "fpdf2>=2.9.0",
    "httpx>=0.27",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pycryptodome>=4.2.0",
    "pydantic-settings>=2.4",
    "pypdfium2>=5.14.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "uharfbuzz>=0.57.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
