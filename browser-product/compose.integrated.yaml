# Integrated mode for a private, authenticated deployment. Works with compose.yaml locally;
# optionally add compose.vm.yaml on a VM. Public-web navigation is opt-in.
# This overlay fails if required security secrets are missing.
services:
  api:
    environment:
      DEMO_HOST: ${DEMO_HOST:-}
      APP_MODE: integrated
      SECURITY_MODE: signed
      INTERNAL_KEY: ${INTERNAL_KEY:?Set random INTERNAL_KEY}
      APP_SIGNING_KEY: ${APP_SIGNING_KEY:?Set distinct signing key}
      IDENTITY_SIGNING_KEY: ${IDENTITY_SIGNING_KEY:?Set distinct 32+ char signing key}
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:?Set encryption key}
      BROWSER_NAVIGATION_MODE: ${BROWSER_NAVIGATION_MODE:-allowlist}
      BROWSER_ALLOWED_ORIGINS: ${BROWSER_ALLOWED_ORIGINS:-}
      BROWSER_PORTALS_JSON: ${BROWSER_PORTALS_JSON:-}
  worker:
    environment:
      MAX_BROWSER_TABS: ${MAX_BROWSER_TABS:-8}
      MAX_BROWSER_SESSIONS: ${MAX_BROWSER_SESSIONS:-8}
      MAX_BROWSER_IDLE_SECONDS: ${MAX_BROWSER_IDLE_SECONDS:-900}
      APP_MODE: integrated
      INTERNAL_KEY: ${INTERNAL_KEY:?Set random INTERNAL_KEY}
      APP_SIGNING_KEY: ${APP_SIGNING_KEY:?Set distinct signing key}
      BROWSER_NAVIGATION_MODE: ${BROWSER_NAVIGATION_MODE:-allowlist}
      BROWSER_ALLOWED_ORIGINS: ${BROWSER_ALLOWED_ORIGINS:-}
      BROWSER_PORTALS_JSON: ${BROWSER_PORTALS_JSON:-}
      BROWSER_ALLOW_FORM_POST: ${BROWSER_ALLOW_FORM_POST:-false}
      BROWSER_INTERMEDIATE_POST_ORIGINS: ${BROWSER_INTERMEDIATE_POST_ORIGINS:-}
      BROWSER_SEARCH_TARGETS_JSON: ${BROWSER_SEARCH_TARGETS_JSON:-[]}
      BROWSER_FINAL_SUBMIT_TARGETS_JSON: ${BROWSER_FINAL_SUBMIT_TARGETS_JSON:-[]}
      BROWSER_SUBMIT_CONFIRMATIONS_JSON: ${BROWSER_SUBMIT_CONFIRMATIONS_JSON:-[]}
      BROWSER_ENABLE_FINAL_SUBMIT: ${BROWSER_ENABLE_FINAL_SUBMIT:-false}
      CHROMIUM_DISABLE_HTTP2: ${CHROMIUM_DISABLE_HTTP2:-false}
