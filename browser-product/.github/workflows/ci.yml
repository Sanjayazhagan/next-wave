name: gradientzero-demo-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and browsers
        run: |
          python -m pip install -r requirements.lock
          python -m playwright install --with-deps chromium
      - name: Python unit and DOM tests
        run: pytest -q
      - name: Syntax and contracts
        run: |
          python -m compileall -q server browser scripts
          node --check web/app.js
          node --check web/assist.js
          node --check clients/browser_client.mjs
      - name: Human assistance and process restart integration
        run: |
          python scripts/verify_handoff.py
          python scripts/verify_resilience.py
          python scripts/verify_release.py
          python scripts/verify_general_browser.py
          python scripts/verify_conversation.py
      - name: Full browser HTTP smoke on CI
        run: |
          python scripts/run_local.py > /tmp/gradientzero-run.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          python - <<'PYWAIT'
          import time,urllib.request
          for i in range(35):
              try:
                  if urllib.request.urlopen('http://127.0.0.1:8100/health',timeout=1).status==200:
                      break
              except Exception:time.sleep(1)
          else:raise SystemExit('API did not boot')
          PYWAIT
          python scripts/smoke.py
